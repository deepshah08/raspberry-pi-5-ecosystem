version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: omnisearch-qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    environment:
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      - QDRANT__STORAGE__SNAPSHOTS_PATH=/qdrant/snapshots
      - QDRANT__STORAGE__WAL__WAL_CAPACITY_MB=32
      - QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS=0
      # Optimized for NVMe tier storage with persistent WAL and storage volumes
      - QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER=2
    restart: unless-stopped

volumes:
  qdrant_storage:
  qdrant_snapshots:
