version: '3.8'

services:
  event_bus:
    build: .
    container_name: homelab_event_bus
    ports:
      - "8088:8088"
    environment:
      - REDIS_URL=
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped