worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Proxy buffers
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # WebSocket Upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstreams
    upstream dash_home {
        server 192.168.1.80:3030;
    }
    upstream search_home {
        server 192.168.1.80:8008;
    }
    upstream briefing_home {
        server 192.168.1.80:13378;
    }
    upstream status_home {
        server 192.168.1.80:3001;
    }
    upstream metrics_home {
        server 192.168.1.80:3000;
    }
    upstream ai_home {
        server 192.168.1.80:8000;
    }

    # Common Proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    server {
        listen 80;
        server_name dash.home;
        location / {
            proxy_pass http://dash_home;
        }
    }

    server {
        listen 80;
        server_name search.home;
        location / {
            proxy_pass http://search_home;
        }
    }

    server {
        listen 80;
        server_name briefing.home;
        location / {
            proxy_pass http://briefing_home;
        }
    }

    server {
        listen 80;
        server_name status.home;
        location / {
            proxy_pass http://status_home;
        }
    }

    server {
        listen 80;
        server_name metrics.home;
        location / {
            proxy_pass http://metrics_home;
        }
    }

    server {
        listen 80;
        server_name ai.home;
        location / {
            proxy_pass http://ai_home;
        }
    }
}
