version: "3.8"
services:
  dashboard:
    image: python:3.11-slim
    container_name: unified-dashboard
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3030:3030"
    command: >
      bash -c "pip install -r requirements.txt && uvicorn app:app --host 0.0.0.0 --port 3030"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3030/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
