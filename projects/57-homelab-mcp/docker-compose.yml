version: "3.8"

services:
  homelab-mcp:
    image: python:3.12-slim
    container_name: homelab-mcp
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./server.py:/app/server.py:ro
    command: >
      bash -c "pip install mcp[cli] httpx && python3 server.py --transport sse --port 8090 --host 0.0.0.0"
    ports:
      - "8090:8090"
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8090/sse\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
