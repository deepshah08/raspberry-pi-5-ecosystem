version: '3.8'

services:
  speedtest-sentry:
    build: .
    container_name: speedtest-sentry
    ports:
      - "9115:9115"
    deploy:
      resources:
        limits:
          memory: 128M
    command: ["python", "speedtest_sentry.py", "--target-host", "192.168.1.80"]
    restart: unless-stopped
