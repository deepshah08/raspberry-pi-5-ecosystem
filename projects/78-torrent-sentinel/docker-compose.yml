version: '3.8'

services:
  torrent-sentinel:
    build: .
    image: torrent-sentinel:latest
    container_name: torrent-sentinel
    restart: unless-stopped
    environment:
      - API_URL=http://qbittorrent:8080
      - TARGET_RATIO=1.0
    command: ["python", "torrent_sentinel.py", "--api-url", "${API_URL:-http://qbittorrent:8080}", "--target-ratio", "${TARGET_RATIO:-1.0}"]
    deploy:
      resources:
        limits:
          memory: 128M
